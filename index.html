<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Navigation Demo</title>
</head>
<body>
    <header>
        <a href="#">Logo</a>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services &#9660;</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Dropdown Navigation</h1>
        <p>Hover over Services to open the submenu. The submenu sits on top of this content because it is absolutely positioned, so it is taken out of the normal document flow.</p>
        <p>Try tabbing through the links with your keyboard too.</p>
    </main>
</body>
</html>
